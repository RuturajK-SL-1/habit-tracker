<!-- KEEP EVERYTHING SAME UNTIL HabitTracker STARTS -->
<script type="text/babel">

const { useState, useEffect } = React;

const HabitTracker = () => {

const [user, setUser] = useState('');
const [habits, setHabits] = useState([]);
const [completions, setCompletions] = useState({});
const [newHabit, setNewHabit] = useState('');
const [loading, setLoading] = useState(true);
const [showAddHabit, setShowAddHabit] = useState(false);
const [view, setView] = useState('weekly');
const [currentDate, setCurrentDate] = useState(new Date());

const users = ['Rutu','Suku'];

useEffect(() => {
 if(user) loadUserData();
}, [user]);

const loadUserData = async () => {
 const habitsData = localStorage.getItem(`habits:${user}`);
 const completionsData = localStorage.getItem(`completions:${user}`);

 setHabits(habitsData ? JSON.parse(habitsData) : []);
 setCompletions(completionsData ? JSON.parse(completionsData) : {});
 setLoading(false);
};

const saveData = (h,c) => {
 localStorage.setItem(`habits:${user}`, JSON.stringify(h));
 localStorage.setItem(`completions:${user}`, JSON.stringify(c));
};

const getDateString = (date) => {
 const d = new Date(date);
 const y = d.getFullYear();
 const m = String(d.getMonth()+1).padStart(2,'0');
 const da = String(d.getDate()).padStart(2,'0');
 return `${y}-${m}-${da}`;
};

const toggleCompletion = (habitId,date) => {
 const key = `${habitId}:${date}`;
 const updated = {...completions};
 updated[key] ? delete updated[key] : updated[key]=true;
 setCompletions(updated);
 saveData(habits,updated);
};

const addHabit = () => {
 if(!newHabit.trim()) return;
 const updated = [...habits,{id:Date.now(),name:newHabit.trim()}];
 setHabits(updated);
 saveData(updated,completions);
 setNewHabit('');
 setShowAddHabit(false);
};

const deleteHabit = (habitId) => {
 const habit = habits.find(h=>h.id===habitId);
 if(!window.confirm(`Delete "${habit.name}"?\nThis will remove all history.`)) return;

 const updatedHabits = habits.filter(h=>h.id!==habitId);
 const updatedComp = {...completions};

 Object.keys(updatedComp).forEach(k=>{
   if(k.startsWith(`${habitId}:`)) delete updatedComp[k];
 });

 setHabits(updatedHabits);
 setCompletions(updatedComp);
 saveData(updatedHabits,updatedComp);
};

const getWeekDates = () => {
 let dates=[];
 let base=new Date(currentDate);
 let day=base.getDay();
 let mondayOffset=(day===0?-6:1)-day;
 let start=new Date(base);
 start.setDate(base.getDate()+mondayOffset);

 for(let i=0;i<7;i++){
   let d=new Date(start);
   d.setDate(start.getDate()+i);
   dates.push(getDateString(d));
 }
 return dates;
};

const getMonthDates = () => {
 let dates=[];
 let y=currentDate.getFullYear();
 let m=currentDate.getMonth();
 let days=new Date(y,m+1,0).getDate();

 for(let d=1;d<=days;d++){
   dates.push(getDateString(new Date(y,m,d)));
 }
 return dates;
};

const getYearDates = () => {
 let dates=[];
 let y=currentDate.getFullYear();

 for(let m=0;m<12;m++){
   let days=new Date(y,m+1,0).getDate();
   for(let d=1;d<=days;d++){
     dates.push(getDateString(new Date(y,m,d)));
   }
 }
 return dates;
};

const getDateRange = () => {
 if(view==='weekly') return getWeekDates();
 if(view==='monthly') return getMonthDates();
 return getYearDates();
};

const getStreak = (habitId,dateList) => {

 let best=0;
 let run=0;

 dateList.forEach(d=>{
   if(completions[`${habitId}:${d}`]){
     run++;
     if(run>best) best=run;
   } else run=0;
 });

 let current=0;
 for(let i=dateList.length-1;i>=0;i--){
   if(completions[`${habitId}:${dateList[i]}`]) current++;
   else break;
 }

 return {current,best};
};

if(!user){
 return(
 <div className="p-8 text-center">
   {users.map(u=>
     <button key={u} onClick={()=>setUser(u)} className="bg-indigo-600 text-white px-6 py-3 m-2 rounded">
       {u}
     </button>
   )}
 </div>
 );
}

if(loading) return <div>Loading...</div>;

return(
<div className="p-6">

<div className="flex gap-2 mb-4">
 <button onClick={()=>setView('weekly')}>Weekly</button>
 <button onClick={()=>setView('monthly')}>Monthly</button>
 <button onClick={()=>setView('yearly')}>Yearly</button>
</div>

{habits.map(h=>{
 const range=getDateRange();
 const {current,best}=getStreak(h.id,range);

 return(
 <div key={h.id} className="border p-4 mb-3 rounded">

 <div className="flex justify-between">
   <h3>{h.name}</h3>
   <button onClick={()=>deleteHabit(h.id)}>Delete</button>
 </div>

 <div className="flex gap-4 text-sm">
   {current>0 && <span>🔥 Current: {current}</span>}
   {best>0 && <span>⭐ Best: {best}</span>}
 </div>

 </div>
 );
})}

</div>
);
};

ReactDOM.createRoot(document.getElementById("root")).render(<HabitTracker/>);

</script>
